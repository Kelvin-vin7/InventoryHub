<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InventoryHub</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar"><h1>📦 InventoryHub</h1></header>

  <main class="container">
    <section class="stats" id="stats" aria-live="polite"></section>

    <section class="toolbar">
      <input id="search" type="search" placeholder="Search name or SKU..." />
      <select id="category"><option value="">All categories</option></select>
      <select id="sort">
        <option value="name">Sort: Name</option>
        <option value="quantity">Sort: Quantity</option>
        <option value="price">Sort: Price</option>
        <option value="updatedAt">Sort: Last updated</option>
      </select>
      <select id="order">
        <option value="asc">Ascending</option>
        <option value="desc">Descending</option>
      </select>
      <button id="addBtn" class="btn primary">+ Add item</button>
    </section>

    <div id="message" class="message" role="alert" hidden></div>

    <table class="table">
      <thead>
        <tr><th>Name</th><th>SKU</th><th>Category</th><th class="num">Qty</th><th class="num">Price</th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" class="empty" hidden>No items found.</p>

    <nav class="pager">
      <button id="prev" class="btn">&larr; Prev</button>
      <span id="pageInfo"></span>
      <button id="next" class="btn">Next &rarr;</button>
    </nav>
  </main>

  <dialog id="dialog">
    <form id="form" novalidate>
      <h2 id="dialogTitle">Add item</h2>
      <label>Name <input name="name" required /><small class="err" data-for="name"></small></label>
      <label>SKU <input name="sku" required /><small class="err" data-for="sku"></small></label>
      <label>Category <input name="category" /><small class="err" data-for="category"></small></label>
      <label>Quantity <input name="quantity" type="number" min="0" step="1" required /><small class="err" data-for="quantity"></small></label>
      <label>Price <input name="price" type="number" min="0" step="0.01" required /><small class="err" data-for="price"></small></label>
      <div class="actions">
        <button type="button" id="cancelBtn" class="btn">Cancel</button>
        <button type="submit" id="saveBtn" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
